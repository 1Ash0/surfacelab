[project]
name = "surfacelab"
version = "0.1.0"
license = "MIT"
description = "Measure MCP tool-choice robustness, composition, and availability."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.scripts]
surfacelab = "surfacelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surfacelab"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
